
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HaboXrichie Treasure Rush</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080d1c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  padding: 18px 10px;
  background: #121d35;
  color: #ffd700;
}
h1 { margin: 5px; }
#stats {
  display: flex;
  justify-content: space-around;
  padding: 15px;
  font-size: 18px;
}
canvas {
  display: block;
  margin: auto;
  background: linear-gradient(#142b48,#071326);
  border: 3px solid #e6b800;
  border-radius: 12px;
  width: 95%;
  max-width: 420px;
  touch-action: none;
}
button {
  background: #ffc400;
  color: #101010;
  border: 0;
  padding: 14px 30px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  margin: 15px;
}
#message { color: #ffd700; font-size: 19px; }
</style>
</head>
<body>

<header>
<h1>💎 HABOXRICHIE</h1>
<h2>🏆 TREASURE RUSH</h2>
<p>Collect treasures. Avoid bombs. Beat your best score!</p>
</header>

<div id="stats">
<span>💰 Coins: <b id="score">0</b></span>
<span>🏆 Best: <b id="best">0</b></span>
</div>

<canvas id="game" width="400" height="550"></canvas>

<p id="message">Ready for the treasure hunt?</p>
<button id="start">START GAME</button>
<p>Move left and right to collect gold and avoid bombs!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = { x: 180, y: 480, w: 42, h: 42 };
let objects = [];
let score = 0;
let best = Number(localStorage.getItem("treasureBest") || 0);
let running = false;
let frame = 0;
let animation;

document.getElementById("best").textContent = best;

function drawPlayer() {
  ctx.font = "38px Arial";
  ctx.fillText("🏃", player.x, player.y + 35);
}

function drawObjects() {
  objects.forEach(obj => {
    ctx.font = "30px Arial";
    ctx.fillText(obj.type === "coin" ? "💰" : "💣", obj.x, obj.y);
  });
}

function update() {
  if (!running) return;

  ctx.clearRect(0, 0, 400, 550);

  frame++;

  if (frame % 38 === 0) {
    objects.push({
      x: Math.random() * 350,
      y: -20,
      type: Math.random() > 0.28 ? "coin" : "bomb"
    });
  }

  objects.forEach(obj => {
    obj.y += 3 + score / 150;

    if (
      obj.x < player.x + player.w &&
      obj.x + 28 > player.x &&
      obj.y < player.y + player.h &&
      obj.y + 28 > player.y
    ) {
      if (obj.type === "coin") {
        score += 10;
        document.getElementById("score").textContent = score;
        obj.collected = true;
      } else {
        gameOver();
      }
    }
  });

  objects = objects.filter(obj => obj.y < 580 && !obj.collected);

  drawObjects();
  drawPlayer();

  animation = requestAnimationFrame(update);
}

function startGame() {
  cancelAnimationFrame(animation);
  score = 0;
  frame = 0;
  objects = [];
  player.x = 180;
  running = true;

  document.getElementById("score").textContent = "0";
  document.getElementById("message").textContent = "Collect as many treasures as possible!";
  document.getElementById("start").textContent = "RESTART GAME";

  update();
}

function gameOver() {
  running = false;
  cancelAnimationFrame(animation);

  if (score > best) {
    best = score;
    localStorage.setItem("treasureBest", best);
    document.getElementById("best").textContent = best;
  }

  document.getElementById("message").textContent =
    "GAME OVER! You collected " + score + " coins!";
  document.getElementById("start").textContent = "PLAY AGAIN";
}

document.getElementById("start").addEventListener("click", startGame);

function move(x) {
  const rect = canvas.getBoundingClientRect();
  player.x = Math.max(0, Math.min(358, (x - rect.left) * 400 / rect.width - 20));
}

canvas.addEventListener("pointermove", e => {
  if (running && e.buttons) move(e.clientX);
});

canvas.addEventListener("pointerdown", e => {
  if (running) move(e.clientX);
});

document.addEventListener("keydown", e => {
  if (!running) return;
  if (e.key === "ArrowLeft") player.x = Math.max(0, player.x - 25);
  if (e.key === "ArrowRight") player.x = Math.min(358, player.x + 25);
});

ctx.font = "25px Arial";
ctx.fillStyle = "white";
ctx.fillText("Press START GAME to begin!", 65, 270);
</script>
</body>
  </html>
